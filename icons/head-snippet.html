<!-- Favicons & app icons – paste into <head>. Files sit in the icons/ folder next to index.html. -->

<!-- Browser tabs (Chrome, Edge, Firefox, Safari): SVG first, PNG/ICO fallback -->
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-96x96.png" type="image/png" sizes="96x96">
<link rel="icon" href="icons/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">

<!-- iPhone / iPad home screen, Safari favorites & bookmarks, macOS Dock web app -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-title" content="Klecken">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Legacy Safari pinned tab (monochrome) -->
<link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#00387B">

<!-- Android / Chrome "Add to Home screen", Windows/Edge install -->
<link rel="manifest" href="icons/site.webmanifest">
<meta name="theme-color" content="#00387B">

<!-- Windows tiles -->
<meta name="msapplication-TileColor" content="#00387B">
<meta name="msapplication-config" content="icons/browserconfig.xml">
<meta name="application-name" content="Klecken">
