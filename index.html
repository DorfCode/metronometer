<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Browser tabs (Chrome, Edge, Firefox, Safari) -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-96x96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="icons/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="icons/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="icons/favicon.ico" sizes="48x48">
    
    <!-- iPhone/iPad home screen, Safari favorites, macOS -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
    <meta name="apple-mobile-web-app-title" content="Klecken">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#00387B">
    
    <!-- Android / Chrome "Add to Home screen", Windows/Edge -->
    <link rel="manifest" href="icons/site.webmanifest">
    <meta name="theme-color" content="#00387B">
    <meta name="msapplication-TileColor" content="#00387B">
    <meta name="msapplication-config" content="icons/browserconfig.xml">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>metronometer</title>
    <style>
        /* 1. Global Box-Sizing: Stops borders and paddings from breaking layouts */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.5;
            margin: 0;
            padding: 16px 12px;
        }

        /* Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 16px 16px 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.4rem;
            margin: 0 0 16px 0;
        }

        /* Menu / Accordion Cards */
        details {
            margin-bottom: 8px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            background-color: #fafbfc;
            overflow: hidden;
        }

        summary {
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 14px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #34495e;
        }

        summary:focus-visible {
            outline: 2px solid #3498db;
            background-color: #f0f7fc;
        }

        summary::-webkit-details-marker,
        summary::marker {
            display: none;
        }

        /* Custom Plus/Minus Icon */
        summary:after {
            content: '+';
            font-size: 1.3em;
            color: #3498db;
            line-height: 1;
            transition: transform 0.2s ease;
            margin-left: 10px;
        }

        details[open] summary:after {
            transform: rotate(45deg);
            color: #e74c3c;
        }

        /* Content Area: Uses gap instead of competing margins */
        .faq-content {
            padding: 12px 14px 6px 14px;
            font-size: 0.9rem;
            color: #444;
            background-color: #ffffff;
            border-top: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .liste {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0;
        }

        .stand {
            font-size: 0.8rem;
            color: #666;
        }

        .timer {
            font-size: 0.72rem;
            color: #7a8794;
            letter-spacing: 0.01em;
            white-space: nowrap;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .timer .symbol {
            font-size: 0.9rem;
            line-height: 1;
            transform: translateY(-1px);
        }

        /* Train Cards */
        .zug {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin: 0;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            background-color: #fafbfc;
        }

        .zeit {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .zeit .alt {
            text-decoration: line-through;
            color: #999;
            font-weight: 400;
            font-size: 1.1rem;
        }

        .zeit .neu {
            color: #d97706;
        }

        .info {
            font-size: 0.8rem;
            color: #546575;
        }

        .grund {
            font-size: 0.78rem;
            color: #d97706;
            margin-top: 2px;
        }

        .status {
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
            margin-left: 10px;
        }

        .gleis {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-top: 2px;
        }

        .gleis.abweichend {
            color: #e74c3c;
        }

        .puenktlich { color: #1a8f3c; }
        .spaet { color: #d97706; }
        .ausfall { color: #e74c3c; }
        .zug.ausgefallen .zeit {
            text-decoration: line-through;
            color: #999;
        }

        .fehler {
            color: #e74c3c;
            font-size: 0.85rem;
            white-space: pre-wrap;
            margin: 0;
        }
        
        .fehler:empty {
            display: none;
        }

        /* Footers */
        .footer {
            text-align: center;
            margin-top: 12px;
            margin-bottom: 0;
            color: #666;
            font-size: 0.8rem;
        }

        .footer a {
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer a.quelle,
        .footer a.quelle:hover,
        .footer a.quelle:visited,
        .footer a.quelle:active {
            color: inherit;
            text-decoration: none;
        }

        .footer .heart {
            color: #e74c3c;
            font-size: 1.1em;
            vertical-align: middle;
            margin: 0 0.3em;
        }

        .footer .qr-icon {
            width: 1.3em;
            height: 1.3em;
            vertical-align: middle;
            fill: currentColor;
        }

        .qr-dialog {
            border: none;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .qr-dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        .qr-dialog img {
            display: block;
            width: min(70vw, 260px);
            height: auto;
            margin: 0 auto 12px;
        }

        .qr-dialog button {
            font: inherit;
            padding: 6px 16px;
            cursor: pointer;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            body { padding: 8px 6px; }
            .container { padding: 12px 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>metronometer</h1>

        <details data-station="Klecken" data-via="Harburg" data-richtung="harburg" data-standardgleis="2">
            <summary>Klecken → Harburg</summary>
            <div class="faq-content">
                <div class="liste"></div>
                <div class="meta">
                    <div class="stand">Lade …</div>
                    <div class="timer" aria-live="polite"><span class="symbol">↻</span> <span class="value"></span></div>
                </div>
                <div class="fehler"></div>
            </div>
        </details>

        <details data-station="Klecken" data-via="Hamburg Hbf" data-richtung="Hamburg Hbf" data-standardgleis="2">
            <summary>Klecken → Hamburg HBF</summary>
            <div class="faq-content">
                <div class="liste"></div>
                <div class="meta">
                    <div class="stand">Lade …</div>
                    <div class="timer" aria-live="polite"><span class="symbol">↻</span> <span class="value"></span></div>
                </div>
                <div class="fehler"></div>
            </div>
        </details>

        <details data-station="Hamburg-Harburg" data-via="Klecken" data-richtung="klecken">
            <summary>Harburg → Klecken</summary>
            <div class="faq-content">
                <div class="liste"></div>
                <div class="meta">
                    <div class="stand">Lade …</div>
                    <div class="timer" aria-live="polite"><span class="symbol">↻</span> <span class="value"></span></div>
                </div>
                <div class="fehler"></div>
            </div>
        </details>

        <details data-station="Hamburg Hbf" data-via="Klecken" data-richtung="klecken">
            <summary>Hamburg HBF → Klecken</summary>
            <div class="faq-content">
                <div class="liste"></div>
                <div class="meta">
                    <div class="stand">Lade …</div>
                    <div class="timer" aria-live="polite"><span class="symbol">↻</span> <span class="value"></span></div>
                </div>
                <div class="fehler"></div>
            </div>
        </details>

        <p class="footer">Datenquelle: <a class="quelle" href="https://dbf.finalrewind.org/" target="_blank" rel="noopener noreferrer">dbf.finalrewind.org</a></p>
    </div>

    <div class="footer">
        &copy; 2026
        <a href="mailto:dorfcode@icloud.com?subject=Feedback%20zu%20metronometer">DorfCode</a>
        <span class="heart" aria-hidden="true">♥</span>
        <a href="https://paypal.me/oleluehrs/1" target="_blank" rel="noopener noreferrer">1€ PayPal</a>
        <span class="heart" aria-hidden="true">♥</span>
        <a href="QRcode-metronometer.png" id="qr-link" aria-label="QR-Code" title="QR-Code">
            <svg class="qr-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd" d="M3 3h8v8H3zM5 5v4h4V5zM13 3h8v8h-8zM15 5v4h4V5zM3 13h8v8H3zM5 15v4h4v-4z"/>
                <path d="M13 13h3v3h-3zM18 13h3v3h-3zM16 16h3v3h-3zM13 19h3v2h-3zM19 19h2v2h-2z"/>
            </svg>
        </a>
    </div>

    <dialog id="qr-dialog" class="qr-dialog" aria-label="QR to share">
        <img src="QRcode-metronometer.png" alt="QR code to share metronometer">
        <button type="button" id="qr-close">Close</button>
    </dialog>

<script>
const ANZAHL = 3;
const REFRESH_SECONDS = 60;

function textVon(v) {
    if (!v) return "";
    return typeof v === "string" ? v : (v.name || "");
}

function minuten(zeit) {
    const [h, m] = String(zeit).split(":").map(Number);
    return h * 60 + m;
}

function setTimerText(box, remaining) {
    const timerValue = box.querySelector(".value");
    if (!timerValue) return;

    const displayValue = remaining % 10 === 0 ? remaining : Math.ceil(remaining / 10) * 10;
    timerValue.textContent = displayValue + "s";
}

function startRefreshCountdown(box) {
    if (box._refreshTimer) {
        clearInterval(box._refreshTimer);
    }

    let remaining = REFRESH_SECONDS;
    setTimerText(box, remaining);

    box._refreshTimer = setInterval(() => {
        if (!box.open) {
            clearInterval(box._refreshTimer);
            box._refreshTimer = null;
            return;
        }

        remaining -= 1;
        if (remaining <= 0) {
            clearInterval(box._refreshTimer);
            box._refreshTimer = null;
            laden(box);
            return;
        }

        if (remaining % 10 === 0 || remaining === REFRESH_SECONDS - 1) {
            setTimerText(box, remaining);
        }
    }, 1000);
}

// Delay reasons and notes from the API
function meldungen(d) {
    const m = d.messages || {};
    const texte = [].concat(m.delay || [], m.qos || [])
        .map(x => (typeof x === "string" ? x : (x.text || "")).trim())
        .filter(Boolean);
    const eindeutig = [...new Set(texte)];
    return eindeutig.map(t => t.replace(/[<>&]/g, "")).join(" · ");
}

function zugElement(d, standardGleis) {
    const geplant = d.scheduledDeparture || d.scheduledArrival || "";
    const verspaetung = d.delayDeparture ?? d.delayArrival ?? 0;
    const ausgefallen = !!d.isCancelled;

    let klasse = "puenktlich", text = "pünktlich";
    if (ausgefallen) { klasse = "ausfall"; text = "fällt aus"; }
    else if (verspaetung > 0) { klasse = "spaet"; text = "+" + verspaetung + " min"; }

    let tatsaechlich = "";
    if (!ausgefallen && verspaetung > 0 && /^\d{1,2}:\d{2}$/.test(geplant)) {
        const t = (minuten(geplant) + verspaetung) % 1440;
        tatsaechlich = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
    }

    const gleis = d.platform ? String(d.platform).trim() : "";
    const gleisAbweichend = !ausgefallen && !!standardGleis && !!gleis && gleis !== standardGleis;

    const gruende = [gleisAbweichend ? "Abfahrt heute von Gleis " + gleis + "!" : "", meldungen(d)]
        .filter(Boolean).join("<br>");

    const el = document.createElement("div");
    el.className = "zug" + (ausgefallen ? " ausgefallen" : "");
    el.innerHTML =
        '<div><div class="zeit">' +
        (tatsaechlich
            ? '<span class="alt">' + geplant + '</span> <span class="neu">' + tatsaechlich + '</span>'
            : geplant) +
        '</div>' +
        '<div class="info">' + (d.train || d.line || "") + ' → ' + textVon(d.destination) + '</div>' +
        (gruende ? '<div class="grund">' + gruende + '</div>' : '') + '</div>' +
        '<div class="status"><div class="' + klasse + '">' + text + '</div>' +
        (gleis ? '<div class="gleis' + (gleisAbweichend ? ' abweichend' : '') + '">Gleis ' + gleis + '</div>' : '') + '</div>';
    return el;
}

async function laden(box) {
    const station = box.dataset.station;
    const liste = box.querySelector(".liste");
    const fehler = box.querySelector(".fehler");
    const stand = box.querySelector(".stand");
    fehler.textContent = "";

    const url = "https://dbf.finalrewind.org/" + encodeURIComponent(station)
              + "?version=3&mode=json&admode=dep&limit=60"
              + (box.dataset.via ? "&via=" + encodeURIComponent(box.dataset.via) : "");
    try {
        const antwort = await fetch(url);
        if (!antwort.ok) throw new Error("HTTP " + antwort.status);
        const daten = await antwort.json();
        if (daten.error) throw new Error(daten.error);

        const abfahrten = (daten.departures || []).slice(0, ANZAHL);

        liste.innerHTML = "";
        if (!abfahrten.length) liste.textContent = "Keine passenden Abfahrten gefunden.";
        abfahrten.forEach(d => liste.appendChild(zugElement(d, box.dataset.standardgleis)));
        stand.textContent = "Stand: " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        startRefreshCountdown(box);
    } catch (e) {
        stand.textContent = "Fehler beim Laden";
        fehler.textContent = e.message;
        startRefreshCountdown(box);
    }
}

document.querySelectorAll("details").forEach(box => {
    box.addEventListener("toggle", () => {
        if (box.open) {
            laden(box);
        } else if (box._refreshTimer) {
            clearInterval(box._refreshTimer);
            box._refreshTimer = null;
        }
    });
});

(function () {
    const dialog = document.getElementById('qr-dialog');
    document.getElementById('qr-link').addEventListener('click', function (e) {
        e.preventDefault();
        dialog.showModal();
    });
    document.getElementById('qr-close').addEventListener('click', function () {
        dialog.close();
    });
    dialog.addEventListener('click', function (e) {
        if (e.target === dialog) dialog.close();
    });
})();
</script> 
</body>
</html>
